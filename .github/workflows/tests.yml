# Run every test on every push: the back-end unit tests, then the end-to-end browser tests.
name: tests

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Get the code, then install the two languages the app uses.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Back end: install the Python libraries and run pytest.
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m pytest
        working-directory: backend

      # Front end: install exactly the locked packages and Chromium, then run Playwright.
      # Playwright starts the API and the Vite dev server itself (see frontend/playwright.config.js).
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend

  # Build both Docker images, start the app, and check the API answers through nginx.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --detach
      # Ask for the metrics through nginx on port 8080; retry while the API starts (up to about 30 s).
      - run: curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-all-errors http://localhost:8080/api/metrics
      # If anything failed, print the containers' logs to help find out why.
      - if: failure()
        run: docker compose logs
      - run: docker compose down
