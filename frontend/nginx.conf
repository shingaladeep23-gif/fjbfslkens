# Serve the built React page, and pass /api requests on to the FastAPI container, just like
# Vite's proxy does in development. The browser sees one site, so no CORS is needed.
server {
    listen 80;
    root /usr/share/nginx/html;

    # "backend" is the API service's name in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
